name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.3
          persist-credentials: false
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: install chore
        env:
          GH_TOKEN: ${{ github.token }}
        run: rust-fs-exfat/scripts/ci-install-chore.sh
      - run: python3 -m venv "$RUNNER_TEMP/python" && "$RUNNER_TEMP/python/bin/pip" install PyYAML==6.0.3
      - run: echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: chore build && chore lint && chore test:unit && chore package && chore test:package
        working-directory: rust-fs-exfat
      - run: chore test:oracle
        if: runner.os == 'macOS'
        working-directory: rust-fs-exfat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: rust-fs-exfat/tmp/logs/
  harness-vm:
    # The harness guest boots on x86_64 KVM, and scripts/vm-setup.sh, which
    # runs in it, fails unless exfatprogs and the kernel's exfat module are
    # there. `chore tools` runs the harness's own host check.
    name: harness VM (x86_64 KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - name: install chore
        env:
          GH_TOKEN: ${{ github.token }}
        run: rust-fs-exfat/scripts/ci-install-chore.sh
      - run: python3 -m venv "$RUNNER_TEMP/python" && "$RUNNER_TEMP/python/bin/pip" install PyYAML==6.0.3
      - run: echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - run: chore siblings
        working-directory: rust-fs-exfat
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
        working-directory: rust-fs-exfat
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - run: chore tools
        working-directory: rust-fs-exfat
      - run: chore vm:up
        working-directory: rust-fs-exfat
      - run: chore vm:down
        working-directory: rust-fs-exfat
  ci-ok:
    runs-on: ubuntu-latest
    needs: [test, harness-vm]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
