  ci-ok:
    name: ci-ok
    # Always, so a failed, skipped or cancelled job fails the gate instead of
    # skipping it: GitHub counts a skipped required check as passing.
    if: always()
    # Every job above. scripts/ci-ok.sh judges the same list, and
    # tests/scripts/test-ci-profile.sh holds the two equal.
    needs: [changes, unit, fixtures, images, test, suite-in-vm, test-arm64, oracle-macos, package, semver, msrv, wasm, cli, provenance, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # scripts/ci-superseded.sh lists this workflow's runs.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      # A cancelled run fails the gate, unless a newer run of the same pull
      # request superseded it (the concurrency block above): that run's ci-ok
      # reports the verdict, and a failed one here would sit beside it when
      # both ran for one commit (#167). Cancelled by hand with nothing newer,
      # or a red:, main or merge-queue run: it fails.
      - name: A cancelled workflow fails unless a newer run superseded it
        if: cancelled()
        env:
          CANCELLED: "true"
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-superseded.sh || bash scripts/ci-ok.sh < /dev/null
      # Not after a cancellation: the step above decided that run.
      - name: Every job ran and succeeded
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The plan the changes job made: quick or full, and false only for
          # a change to documentation alone. scripts/ci-ok.sh accepts a skip
          # only where that plan made one, and refuses a missing plan.
          PROFILE: ${{ needs.changes.outputs.profile }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | bash scripts/ci-ok.sh
