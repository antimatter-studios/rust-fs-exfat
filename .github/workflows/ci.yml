name: ci

# EVERY JOB RUNS CHORE TASKS, so a green local `chore <task>` is the same
# evidence as the job that runs it here. rust-fs-ext4's ci.yml is the
# template, the VM half included: fixtures built in the harness guest, the
# Linux oracles called in it, and the whole suite run inside it.
#
#   changes       which profile this event runs (scripts/ci-plan.sh: quick
#                 for a pull request, full for a "red:" one and for
#                 everything else) and whether the change is more than
#                 documentation (rust-fs-core's code-changed.sh). Every job
#                 here runs in both profiles today; the VM jobs will be
#                 gated on the plan, and ci-ok accepts their skip only where
#                 it made one.
#   unit          `chore test:unit` on a runner with NO fixtures: the tests
#                 that need no tool, no fixture image and no VM, in the
#                 debug profile that traps an arithmetic overflow. That the
#                 job passes with test-disks/ empty is what proves the
#                 split. Then `chore lint`. (`chore build` goes first in
#                 every job that runs the unit tier, so its log holds no
#                 cold build.)
#   fixtures      (#121) `chore fixtures`: the kernel-made images, built in
#                 the harness VM under KVM on x86_64 after `chore siblings`
#                 and `chore tools`, handed to the other jobs as an
#                 artifact.
#   images        (#122) `chore test:images`: the fixtures artifact read
#                 with no VM, against the kernel's listing of each image.
#   test          x86_64, where GitHub gives us KVM: the Linux oracles,
#                 every exfatprogs call (`chore test:oracle`), every kernel
#                 mount (`chore test:kernel`) and every relan/exfat call
#                 (`chore test:third`), inside the VM.
#   test-arm64    aarch64 matters on its own (c_char is unsigned there, and
#                 Apple Silicon hosts run on it) but GitHub's arm64 runners
#                 have NO KVM, so no VM can run: this job runs the tiers
#                 that need none -- lint, the unit tier and
#                 `chore test:images`.
#   suite-in-vm   `chore test:vm`: every Linux tier compiled and run
#                 inside the guest, the way a macOS host runs the Linux one.
#   oracle-macos  `chore test:unit` and `chore test:images` on macOS, then
#                 `chore test:oracle-macos`: macOS's own newfs_exfat,
#                 fsck_exfat -n and read-only driver, the independent
#                 oracle that needs no VM -- only a Mac.
#   package       `chore test:package`: `cargo package` verifies the crate
#                 as published, and a copy proves packaging leaves nothing a
#                 later test build links (#5).
#   semver        `chore check:semver`: the public API against the newest
#                 crates.io release -- or main, until there is one -- refusing
#                 a break Cargo.toml's version does not declare.
#   msrv          `chore check:msrv`: the library and the binary built on
#                 the toolchain Cargo.toml's `rust-version` names, so the
#                 declared minimum stays the true one.
#   wasm          `chore tools:wasm` then `chore test:wasm`: the browser
#                 build (wasm32-unknown-unknown) RUN under wasm-bindgen-test
#                 in Node, because std there compiles calls that panic at
#                 run time -- a build-only check cannot see them.
#   cli           `chore cli:install` then `chore test:cli`: the
#                 command-line tools built in release mode, staged under
#                 every name first on PATH, and tested AS INSTALLED --
#                 `rust-fs-exfat doctor` first, then tests/cli/*.sh. A change
#                 that breaks a tool fails the pull request, not the release.
#   provenance    `chore check:provenance`: no tracked file names a copyleft
#                 exFAT implementation's source or licence (AGENTS.md). No
#                 toolchain: it reads the tree, so it answers in seconds.
#   scripts       `chore test:scripts`: the shell tests, tests/scripts/*.sh,
#                 which hold this file, its verdict and the repository's own
#                 scripts to what they say. No toolchain.
#   ci-ok         the one required check: green only when every job above
#                 ran and succeeded (failed, cancelled OR skipped fails it;
#                 a run cancelled because a newer one superseded it passes
#                 it, scripts/ci-superseded.sh, #208).
#
# THE OUTPUT BUDGET IS IN THE TASKS, so it is in this workflow too. Each
# tier writes its full output to tmp/logs/<tier>.log and prints a verdict; a
# tier that prints more than its measured budget FAILS (exit 65). Nothing
# extra is needed in this file: every job runs chore tasks.
#
# The logs are uploaded as artifacts (tier-logs-<job>), `if: always()`
# because the run worth reading is the one that failed -- AND only once the
# job's first tier step has run (`steps.tier.outcome != 'skipped'`). A job
# that dies in setup or in lint has written no tmp/logs/*.log, and an upload
# refusing an empty path would add a second red step hiding the real cause
# (rust-fs-ext4 #306). tests/scripts/test-ci-profile.sh holds every upload
# to that.
#
# THE LAYOUT. Each job checks this repository out into rust-fs-exfat/ and
# rust-fs-core into rust-fs-core/ beside it, at chores.yml's FS_CORE_REF,
# because chores.yml runs rust-fs-core's scripts in place from
# ../rust-fs-core. That tooling ref is v0.4.5, the first release whose
# agents-core-check.sh expects agent-core v10; the crate dependency in
# Cargo.toml is pinned separately. `chore siblings` (#120) replaces that second checkout.
# Every `run:` runs in rust-fs-exfat/ (`defaults` below).

on:
  push:
    branches: [main]
  # NO BRANCH FILTER ON PULL REQUESTS. Every pull request here is a layer of
  # one stack, based on the layer below it, not on main; with `branches:
  # [main]` every layer but the bottom one would run nothing.
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:
  workflow_dispatch:

# CONCURRENCY (#208). An ordinary pull request's runs share one group per
# workflow and pull request number, and a newer head cancels the run it
# supersedes, its queued jobs included (ci-ok alone still runs, a few
# seconds, to say the run was superseded): a superseded run holds runners
# that every other repository's required checks are waiting for, and its
# verdict judges a commit nobody will land. Everything else keeps its
# evidence, in a group of its own (run id and attempt, so even a pending run
# is never replaced by a newer one) with cancelling off:
#   - a `red:` pull request (the title match ignores case, as scripts/
#     ci-plan.sh's does): its run is the failing test's evidence (AGENTS.md),
#     so the group names the head commit, and a later push -- the fix, with
#     `red:` dropped -- joins the ordinary group without cancelling it;
#   - every push to main, merge-queue run and manual dispatch: the queue
#     reads each group's ci-ok, and main's history keeps every verdict.
# tests/scripts/test-red-runs-uncancelled.sh evaluates these expressions for
# every event and holds them to this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}-{3}', startsWith(github.event.pull_request.title, 'red:') && 'red' || github.event_name, github.event.pull_request.head.sha || github.sha, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') }}

permissions:
  contents: read

defaults:
  run:
    working-directory: rust-fs-exfat

env:
  RUSTUP_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: never
  CHORE_VERSION: "0.19.0"

jobs:
  changes:
    name: changes (which profile, and does it need the full pipeline?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.c.outputs.code }}
      profile: ${{ steps.plan.outputs.profile }}
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.5
          persist-credentials: false
          path: rust-fs-core
      - name: Plan the profile
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          profile="$(bash scripts/ci-plan.sh "$EVENT" "$TITLE")"
          echo "profile=$profile ($EVENT)"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PULL_BASE...$PULL_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee "$RUNNER_TEMP/changed.txt"
            code="$(bash ../rust-fs-core/scripts/code-changed.sh < "$RUNNER_TEMP/changed.txt")"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Pick runners
        # One pick per light Linux job, from the owner's runner gate. The
        # fallback is ubuntu-24.04, not ubuntu-latest: the self-hosted image
        # is Ubuntu 24.04, and ubuntu-latest moved to 26.04, whose stock
        # exfatprogs adds lines to `doctor` and breaks the cli tier's budget.
        id: runners
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: unit msrv package provenance scripts semver cli wasm
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-24.04; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-24.04 --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-24.04
            case "$r" in antimatter-vps-linux-x64|ubuntu-24.04) echo "$r" ;; *) echo ubuntu-24.04 ;; esac
          }
          runners='{}'
          for job in $JOBS; do runners=$(jq -c --arg j "$job" --arg r "$(pick "$job")" '. + {($j): $r}' <<<"$runners"); done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  unit:
    name: unit (no tools, no fixtures)
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['unit'] || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.5
          persist-credentials: false
          path: rust-fs-core
      - name: Stock runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl build-essential python3-venv ripgrep
      - name: Install chore
        # Pinned (CHORE_VERSION) and checked against the release's checksums.
        run: scripts/ci-install-chore.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Host tools for lint
        # PyYAML for rust-fs-core's ci-gate.sh, ripgrep for check-read-only.sh
        # and check-provenance.sh. `chore tools` (#120) takes this over.
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-fs-exfat/target
          key: ${{ runner.os }}-unit-cargo-${{ hashFiles('rust-fs-exfat/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-unit-cargo-
      - name: No fixtures are present
        run: |
          set -euo pipefail
          if ls test-disks/*.img >/dev/null 2>&1; then
            echo "::error::test-disks/ has images; this job must prove the unit tier needs none"
            exit 1
          fi
      # Everything test:unit links, built first, so the tier's log holds the
      # tests and not a cold build's hundred `Compiling` lines, which its
      # measured budget does not allow for.
      - name: chore build
        run: chore build
      - name: chore test:unit
        id: tier
        run: chore test:unit
      - name: chore lint
        run: chore lint
      - name: Keep the tier logs
        # A quiet tier writes its detail to tmp/logs/<tier>.log and prints a
        # verdict; without this the detail dies with the runner. Not before
        # the tier ran, though, or there is no log and this step's red hides
        # the real one (rust-fs-ext4 #306).
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-logs-unit
          path: rust-fs-exfat/tmp/logs/*.log
          if-no-files-found: error

  fixtures:
    # The harness guest boots on x86_64 KVM; scripts/vm-setup.sh fails
    # unless exfatprogs and the kernel's exfat module are there; and every
    # fixture is formatted by mkfs.exfat and written by the kernel in it.
    # The images, manifests and kernel listings go on as one artifact, so
    # each later job reads the same build (#121).
    name: fixtures (harness VM, x86_64 KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: PyYAML
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore tools
        run: chore tools
      - name: chore fixtures
        run: chore fixtures
      # The shared guest outlives each run by design (harness v0.7.0), but a
      # runner has no later run to share it with: stop it, then prove it
      # stopped. vm:down leaves the guest up while a session still holds it,
      # so a leaked session fails the status check below.
      - name: chore vm:down
        run: chore vm:down
      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixtures
          path: rust-fs-exfat/test-disks/exfat-*
          if-no-files-found: error
          retention-days: 7
      - name: Pick runners
        # images needs this job too, so its pick is made here, as the last
        # step: a pick reserves the slot for 120 s, and one made in changes
        # would expire long before fixtures finishes. Same contract as the
        # picker in changes.
        id: runners
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: images
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-24.04; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-24.04 --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-24.04
            case "$r" in antimatter-vps-linux-x64|ubuntu-24.04) echo "$r" ;; *) echo ubuntu-24.04 ;; esac
          }
          runners='{}'
          for job in $JOBS; do runners=$(jq -c --arg j "$job" --arg r "$(pick "$job")" '. + {($j): $r}' <<<"$runners"); done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  images:
    # chore test:images (#122): the strict reader, the audit and salvage on
    # every fixture against the kernel's listing, with only the fixtures
    # artifact present. No VM and no exfatprogs; test-arm64 and oracle-macos
    # run the same tier on their architectures.
    name: images (x86_64, fixtures artifact, no VM)
    needs: [changes, fixtures]
    runs-on: ${{ fromJSON(needs.fixtures.outputs.runners || '{}')['images'] || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.5
          persist-credentials: false
          path: rust-fs-core
      - name: Stock runner tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl build-essential
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-fs-exfat/target
          key: ${{ runner.os }}-images-cargo-${{ hashFiles('rust-fs-exfat/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-images-cargo-
      - name: The fixtures, from the fixtures job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fixtures
          path: rust-fs-exfat/test-disks
      - name: chore test:images
        id: tier
        run: chore test:images
      - name: Keep the tier logs
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-logs-images
          path: rust-fs-exfat/tmp/logs/*.log
          if-no-files-found: error

  test:
    # x86_64, where GitHub gives us KVM: the Linux oracles, every call inside
    # the harness guest. exfatprogs (`chore test:oracle`, #123), the
    # kernel's loop mounts (`chore test:kernel`, #124) and relan/exfat, a
    # third implementation built in the guest (`chore test:third`, #125),
    # judge every fixture. The
    # runner's own exfatprogs is made unusable first, so a test that ran a
    # tool on the host would fail here as well as in tests/test_contract.rs.
    name: test (x86_64, oracles in the VM)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.5
          persist-credentials: false
          path: rust-fs-core
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-fs-exfat/target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('rust-fs-exfat/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-cargo-
      - name: PyYAML
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore tools
        run: chore tools
      - name: The fixtures, from the fixtures job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fixtures
          path: rust-fs-exfat/test-disks
      - name: Make the runner's own exfatprogs unusable
        run: |
          set -eu
          for tool in mkfs.exfat fsck.exfat dump.exfat exfatlabel tune.exfat; do
            path="$(command -v "$tool" 2>/dev/null || true)"
            [ -n "$path" ] || continue
            sudo mv "$path" "$path.host-copy"
            printf '#!/bin/sh\necho "::error::%s ran on the runner; the oracle tools belong in the VM" >&2\nexit 97\n' \
              "$tool" | sudo tee "$path" >/dev/null
            sudo chmod +x "$path"
            echo "poisoned $path"
          done
      - name: chore test:oracle
        id: tier
        run: chore test:oracle
      - name: chore test:kernel
        run: chore test:kernel
      - name: chore test:third
        run: chore test:third
      - name: Keep the tier logs
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-logs-test
          path: rust-fs-exfat/tmp/logs/*.log
          if-no-files-found: error
      # The shared guest outlives each run by design (harness v0.7.0), but a
      # runner has no later run to share it with: stop it, then prove it
      # stopped. vm:down leaves the guest up while a session still holds it,
      # so a leaked session fails the status check below.
      - name: chore vm:down
        run: chore vm:down
      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'

  suite-in-vm:
    # `chore test:vm` (#126): every Linux tier compiled and run inside the
    # guest, the way a macOS host runs the Linux suite. Run on every pull
    # request so that path cannot rot.
    name: suite in the guest (the macOS path)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: PyYAML
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: The fixtures, from the fixtures job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fixtures
          path: rust-fs-exfat/test-disks
      - name: chore test:vm
        id: tier
        run: chore test:vm
      - name: Keep the tier logs
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-logs-suite-in-vm
          path: rust-fs-exfat/tmp/logs/*.log
          if-no-files-found: error
      # The shared guest outlives each run by design (harness v0.7.0), but a
      # runner has no later run to share it with: stop it, then prove it
      # stopped. vm:down leaves the guest up while a session still holds it,
      # so a leaked session fails the status check below.
      - name: chore vm:down
        run: chore vm:down
      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'

  test-arm64:
    name: test (aarch64, no KVM on this runner)
    # No KVM, so no VM: lint, the unit tier, and test:images over the
    # fixtures artifact (#122).
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: rust-fs-exfat
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.4.5
          persist-credentials: false
          path: rust-fs-core
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: Host tools for lint
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends ripgrep >/dev/null
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-fs-exfat/target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('rust-fs-exfat/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-aarch64-cargo-
      - name: chore lint
        run: chore lint
      # Everything test:unit links, built first, so the tier's log holds the
      # tests and not a cold build's hundred `Compiling` lines, which its
      # measured budget does not allow for.
      - name: chore build
        run: chore build
      - name: chore test:unit
        id: tier
        run: chore test:unit
      - name: The fixtures, from the fixtures job
