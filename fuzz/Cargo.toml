[package]
name = "fs-exfat-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The explorer half of the fuzzing setup. The gate half is
# tests/fuzz_decoders.rs in the parent crate, which replays and mutates the
# same corpus on the pinned stable toolchain. Run one target:
#   cargo +nightly fuzz run image
# Run all of them, for a bounded time, which is what CI does:
#   chore fuzz -- 60

[dependencies]
libfuzzer-sys = "=0.4.13"
rust-fs-exfat = { path = ".." }
rust-fs-core = "=0.4.3"
serde = "=1.0.229"
serde_json = "=1.0.149"

[[bin]]
name = "boot_sector"
path = "fuzz_targets/boot_sector.rs"
test = false
doc = false
bench = false

