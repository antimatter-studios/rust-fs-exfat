[package]
name = "rust-fs-exfat"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Strict read-only exFAT reader"
repository = "https://github.com/antimatter-studios/rust-fs-exfat"
exclude = ["fuzz", "tmp", "dist"]

[lib]
name = "fs_exfat"
crate-type = ["rlib", "staticlib"]

[features]
cli = ["rust-fs-core/cli"]

[[bin]]
name = "rust-fs-exfat"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
rust-fs-core = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
unicode-normalization = "=0.1.24"
sha2 = "=0.10.9"
serde_json = "=1.0.149"

[workspace]
exclude = ["fuzz"]

[[test]]
name = "primitives"
path = "tests/primitives.rs"

[[test]]
name = "macos_boot"
path = "tests/oracle/boot.rs"

[[test]]
name = "macos_metadata"
path = "tests/oracle/metadata.rs"

[[test]]
name = "macos_directory"
path = "tests/oracle/directory.rs"

[[test]]
name = "macos_file"
path = "tests/oracle/file.rs"

[[test]]
name = "macos_path"
path = "tests/oracle/path.rs"

[[test]]
name = "macos_fuzz_seeds"
path = "tests/oracle/fuzz_seeds.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "macos_interfaces"
path = "tests/oracle/interfaces.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
