[package]
name = "rust-fs-exfat"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "exFAT filesystem driver: strict reader, writer and read-only salvage"
repository = "https://github.com/antimatter-studios/rust-fs-exfat"
exclude = ["fuzz", "tmp", "dist"]


# WHAT THE RELEASE TARBALL SHIPS, read by rust-fs-core's package-cli
# (release.yml's called release-cli workflow), as in rust-fs-ext4: every
# dotted name the multi-call binary answers to, and its man section. The
# binary's own `generate names` lists exactly these.
[package.metadata.package-cli]
names = { "fs.exfat" = 1, "fsck.exfat" = 8 }
licenses = ["LICENSE"]
[lib]
name = "fs_exfat"
crate-type = ["rlib", "staticlib"]

[features]
cli = ["rust-fs-core/cli"]
test-support = []

[[bin]]
name = "rust-fs-exfat"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
rust-fs-core = "=0.4.5"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
unicode-normalization = "=0.1.24"
serde_json = "=1.0.149"

[workspace]
exclude = ["fuzz"]

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
required-features = ["test-support"]

[[test]]
name = "primitives"
path = "tests/primitives.rs"

[[test]]
name = "salvage"
path = "tests/salvage.rs"
required-features = ["test-support"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["test-support"]

[[test]]
name = "macos_boot"
path = "tests/oracle/boot.rs"

[[test]]
name = "macos_metadata"
path = "tests/oracle/metadata.rs"

[[test]]
name = "macos_directory"
path = "tests/oracle/directory.rs"

[[test]]
name = "macos_file"
path = "tests/oracle/file.rs"

[[test]]
name = "macos_path"
path = "tests/oracle/path.rs"

[[test]]
name = "macos_fuzz_seeds"
path = "tests/oracle/fuzz_seeds.rs"

[[test]]
name = "macos_write"
path = "tests/oracle/write.rs"

[[test]]
name = "macos_raw_write"
path = "tests/oracle/raw_write.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[test]]
name = "cli_write"
path = "tests/cli_write.rs"
required-features = ["cli"]

[[test]]
name = "macos_interfaces"
path = "tests/oracle/interfaces.rs"
required-features = ["cli"]

[[test]]
name = "macos_device"
path = "tests/oracle/device.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"

# The profile the slow test tiers build with. [profile.release] is for what
# this repository ships (the release workflow's binaries and libraries), and
# a consumer ignores a dependency's profiles anyway, so its link-time
# optimisation buys the tests nothing and costs memory: a test build makes
# one binary per tests/*.rs, and LTO works on each of them whole. This
# keeps release's optimisation level and turns LTO off. Measured on a Mac
# (2026-11-14), `cargo test --no-run --features cli,test-support` from a
# clean target peaked at 611 MB with --release and 537 MB with this
# profile; the images tier ran 7 tests in 25.3 s of CPU under --release,
# 26.2 s here, and 235 s in the dev profile, so the optimisation stays.
[profile.test-opt]
inherits = "release"
lto = false

[[test]]
name = "images"
path = "tests/images.rs"

[[test]]
name = "exfatprogs"
path = "tests/exfatprogs.rs"

[[test]]
name = "kernel"
path = "tests/kernel.rs"

[[test]]
name = "third"
path = "tests/third.rs"

# The browser build's test (tests/wasm.rs, `chore test:wasm`) runs under
# wasm-bindgen-test in Node. MIT/Apache-2.0, test-only, and only for the
# target that needs it: no other build resolves it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
