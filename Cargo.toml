[package]
name = "rust-fs-exfat"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Strict read-only exFAT reader"
repository = "https://github.com/antimatter-studios/rust-fs-exfat"
exclude = ["fuzz", "tmp", "dist"]

[lib]
name = "fs_exfat"
crate-type = ["rlib", "staticlib"]

[dependencies]
rust-fs-core = "=0.4.3"

[dev-dependencies]
unicode-normalization = "=0.1.24"
sha2 = "=0.10.9"

[workspace]
exclude = ["fuzz"]

[[test]]
name = "macos_boot"
path = "tests/oracle/boot.rs"

[[test]]
name = "macos_metadata"
path = "tests/oracle/metadata.rs"

[[test]]
name = "macos_directory"
path = "tests/oracle/directory.rs"

[[test]]
name = "macos_file"
path = "tests/oracle/file.rs"

[[test]]
name = "macos_path"
path = "tests/oracle/path.rs"

[profile.release]
lto = "thin"
